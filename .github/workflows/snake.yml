name: Generate Profile Assets

on:
  # run every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  # allow manual trigger from the Actions tab
  workflow_dispatch:
  # also run on push to main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Arhamurrahemeen
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Fetch streak stats SVG (falls back to last good copy if the demolab host is down)
        run: |
          curl -sf "https://streak-stats.demolab.com?user=Arhamurrahemeen&theme=tokyonight&hide_border=true&background=0D1117&ring=3B82F6&fire=60A5FA&currStreakLabel=3B82F6" -o dist/streak-stats.svg \
            || curl -sf "https://raw.githubusercontent.com/Arhamurrahemeen/Arhamurrahemeen/output/streak-stats.svg" -o dist/streak-stats.svg \
            || echo "streak-stats.demolab.com unavailable and no prior copy found; skipping"

      - name: Push generated SVGs to `output` branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
